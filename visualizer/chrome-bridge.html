<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Career-Ops Chrome Bridge</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f7f4;
        --panel: #ffffff;
        --line: #cfe2d8;
        --text: #16332a;
        --muted: #5c766b;
        --accent: #0f8a77;
        --error: #c4513d;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #f7faf7 0%, var(--bg) 100%);
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
      }
      main {
        width: min(720px, calc(100vw - 32px));
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 24px 64px rgba(16, 47, 40, 0.08);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 28px;
      }
      p {
        margin: 0 0 12px;
        color: var(--muted);
      }
      .status {
        margin-top: 20px;
        padding: 16px;
        border-radius: 12px;
        background: #f2faf8;
        border: 1px solid var(--line);
        white-space: pre-wrap;
      }
      .status.is-error {
        background: #fff6f3;
        border-color: #f0c6bc;
        color: var(--error);
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Career-Ops Chrome Bridge</h1>
      <p>这个页面由本地服务自动打开，用于调用 Chrome 扩展读取已登录岗位页并回写结果。</p>
      <p id="jobLine">准备中...</p>
      <div id="statusBox" class="status">正在初始化桥接...</div>
    </main>
    <script>
      const params = new URLSearchParams(window.location.search);
      const taskId = params.get('taskId') || '';
      const jobId = params.get('jobId') || '';
      const statusBox = document.querySelector('#statusBox');
      const jobLine = document.querySelector('#jobLine');

      start().catch((err) => {
        finish('failed', `Chrome 桥接失败：${String(err?.message || err)}`, String(err?.stack || err || ''));
      });

      async function start() {
        if (!taskId || !jobId) throw new Error('缺少 taskId 或 jobId。');
        setStatus(`正在读取任务 ${taskId} ...`);
        const market = await fetchJson('/api/recruitment-market');
        const job = (market.jobs || []).find((item) => item.id === jobId);
        if (!job) throw new Error(`没有找到岗位 ${jobId}。`);
        jobLine.textContent = `岗位：${job.id} / ${job.company || '待解析公司'} / ${job.role || '待解析岗位'}`;
        setStatus('正在等待扩展桥接就绪...');
        await waitForExtensionReady();
        setStatus('扩展桥接已就绪，正在调用 Chrome 插件解析岗位...');
        const result = await sendJobToExtension(job);
        await finish('done', result?.message || result?.result?.message || 'Chrome 插件已解析并回写岗位。', '');
      }

      function waitForExtensionReady() {
        return new Promise((resolve, reject) => {
          let resolved = false;
          const timer = setTimeout(() => {
            cleanup();
            reject(new Error('没有检测到 Chrome 扩展桥接脚本，请确认扩展已加载且允许在 localhost 运行。'));
          }, 15000);
          function cleanup() {
            clearTimeout(timer);
            window.removeEventListener('message', onMessage);
          }
          function onMessage(event) {
            if (event.source !== window || event.origin !== window.location.origin) return;
            const message = event.data || {};
            if (message.source !== 'career-ops-extension' || message.type !== 'CAREER_OPS_EXTENSION_READY') return;
            if (resolved) return;
            resolved = true;
            cleanup();
            resolve();
          }
          window.addEventListener('message', onMessage);
          window.postMessage({ source: 'career-ops-bridge', type: 'CAREER_OPS_BRIDGE_PING' }, window.location.origin);
        });
      }

      function sendJobToExtension(job) {
        const requestId = `bridge-${Date.now()}-${Math.random().toString(16).slice(2)}`;
        return new Promise((resolve, reject) => {
          const timer = setTimeout(() => {
            cleanup();
            reject(new Error('Chrome 插件没有在预期时间内返回结果。'));
          }, 90000);
          function cleanup() {
            clearTimeout(timer);
            window.removeEventListener('message', onMessage);
          }
          function onMessage(event) {
            if (event.source !== window || event.origin !== window.location.origin) return;
            const message = event.data || {};
            if (message.source !== 'career-ops-extension') return;
            if (message.type !== 'CAREER_OPS_PARSE_JOB_WITH_EXTENSION_RESULT') return;
            if (message.requestId !== requestId) return;
            cleanup();
            if (message.ok && message.response?.ok) {
              resolve(message.response.result || message.response);
              return;
            }
            reject(new Error(message.response?.error || 'Chrome 插件没有完成解析。'));
          }
          window.addEventListener('message', onMessage);
          window.postMessage({
            source: 'career-ops',
            type: 'CAREER_OPS_PARSE_JOB_WITH_EXTENSION',
            requestId,
            job: {
              id: job.id || '',
              url: job.url || '',
              company: job.company || '',
              role: job.role || '',
              location: job.location || '',
              salary: job.salary || '',
            },
          }, window.location.origin);
        });
      }

      async function finish(status, message, output) {
        setStatus(message, status === 'failed');
        await fetchJson('/api/recruitment-market/extension-task-complete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ taskId, status, message, output }),
        }).catch(() => null);
        if (status === 'done') {
          setTimeout(() => window.close(), 1200);
        }
      }

      function setStatus(message, isError = false) {
        statusBox.textContent = message;
        statusBox.classList.toggle('is-error', Boolean(isError));
      }

      async function fetchJson(url, options) {
        const response = await fetch(url, options);
        const data = await response.json().catch(() => null);
        if (!response.ok) throw new Error(data?.error || `${url} 返回 HTTP ${response.status}`);
        return data;
      }
    </script>
  </body>
</html>
