<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Career-Ops Extension Bridge</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f8f7;
        --panel: #ffffff;
        --line: #d4e3dc;
        --text: #143129;
        --muted: #5b776c;
        --error: #b64a36;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #f7fbfa 0%, var(--bg) 100%);
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
      }
      main {
        width: min(720px, calc(100vw - 32px));
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 24px 64px rgba(17, 49, 41, 0.08);
      }
      h1 { margin: 0 0 10px; font-size: 28px; }
      p { margin: 0 0 12px; color: var(--muted); }
      .status {
        margin-top: 20px;
        padding: 16px;
        border-radius: 12px;
        background: #f2faf8;
        border: 1px solid var(--line);
        white-space: pre-wrap;
      }
      .status.is-error {
        background: #fff5f2;
        border-color: #f0c9c1;
        color: var(--error);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Career-Ops Extension Bridge</h1>
      <p>这个页面运行在扩展内部，不依赖 localhost 的扩展注入权限。</p>
      <p id="jobLine">准备中...</p>
      <div id="statusBox" class="status">正在初始化扩展桥接...</div>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      const taskId = params.get('taskId') || '';
      const jobId = params.get('jobId') || '';
      const statusBox = document.querySelector('#statusBox');
      const jobLine = document.querySelector('#jobLine');

      start().catch((err) => {
        finish('failed', `扩展桥接失败：${String(err?.message || err)}`, String(err?.stack || err || ''));
      });

      async function start() {
        if (!taskId || !jobId) throw new Error('缺少 taskId 或 jobId。');
        setStatus(`正在读取任务 ${taskId} ...`);
        const market = await fetchJson('http://localhost:4173/api/recruitment-market');
        const job = (market.jobs || []).find((item) => item.id === jobId);
        if (!job) throw new Error(`没有找到岗位 ${jobId}。`);
        jobLine.textContent = `岗位：${job.id} / ${job.company || '待解析公司'} / ${job.role || '待解析岗位'}`;
        setStatus('正在调用扩展后台解析岗位...');
        const response = await sendRuntimeMessage({
          type: 'PARSE_JOB',
          requestId: `ext-bridge-${Date.now()}`,
          job: {
            id: job.id || '',
            url: job.url || '',
            company: job.company || '',
            role: job.role || '',
            location: job.location || '',
            salary: job.salary || '',
          },
        });
        if (!response?.ok) throw new Error(response?.error || '扩展后台没有完成解析。');
        await finish('done', response?.result?.message || 'Chrome 插件已解析并回写岗位。', '');
      }

      async function finish(status, message, output) {
        setStatus(message, status === 'failed');
        await fetchJson('http://localhost:4173/api/recruitment-market/extension-task-complete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ taskId, status, message, output }),
        }).catch(() => null);
        if (status === 'done') setTimeout(() => window.close(), 1200);
      }

      function setStatus(message, isError = false) {
        statusBox.textContent = message;
        statusBox.classList.toggle('is-error', Boolean(isError));
      }

      function sendRuntimeMessage(message) {
        return new Promise((resolve, reject) => {
          chrome.runtime.sendMessage(message, (response) => {
            if (chrome.runtime.lastError) {
              reject(new Error(chrome.runtime.lastError.message));
              return;
            }
            resolve(response);
          });
        });
      }

      async function fetchJson(url, options) {
        const response = await fetch(url, options);
        const data = await response.json().catch(() => null);
        if (!response.ok) throw new Error(data?.error || `${url} 返回 HTTP ${response.status}`);
        return data;
      }
    </script>
  </body>
</html>
