<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title>offerU product logo v2</title>
  <desc>A refined offerU monogram with a clearer U shape and a subtle accepted-offer upward mark.</desc>
  <defs>
    <linearGradient id="shell" x1="8" x2="56" y1="7" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f172a"/>
      <stop offset=".58" stop-color="#1d1d1f"/>
      <stop offset="1" stop-color="#0066cc"/>
    </linearGradient>
    <linearGradient id="uStroke" x1="18" x2="47" y1="14" y2="53" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset=".72" stop-color="#f5f5f7"/>
      <stop offset="1" stop-color="#d2d2d7"/>
    </linearGradient>
    <linearGradient id="lift" x1="24" x2="50" y1="43" y2="19" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9f9fa4"/>
      <stop offset=".5" stop-color="#f5f5f7"/>
      <stop offset="1" stop-color="#0071e3"/>
    </linearGradient>
    <filter id="markShadow" x="-25%" y="-25%" width="150%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="5" stdDeviation="3" flood-color="#020617" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="17" fill="url(#shell)"/>
  <path d="M12.5 50 51.5 11" stroke="#f5f5f7" stroke-width="1.05" stroke-linecap="round" opacity=".12"/>
  <path d="M20 16.5v21.8C20 47.1 24.9 53 32 53s12-5.9 12-14.7V16.5" fill="none" stroke="url(#uStroke)" stroke-width="8.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#markShadow)"/>
  <path d="M26.2 35.8 31.7 41.2 45.5 25.4" fill="none" stroke="url(#lift)" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#markShadow)"/>
  <path d="M44.7 16.5h6.1v6.1" fill="none" stroke="#f5f5f7" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="20" cy="16.5" r="3.2" fill="#f5f5f7"/>
  <circle cx="44" cy="16.5" r="3.2" fill="#ffffff"/>
</svg>
