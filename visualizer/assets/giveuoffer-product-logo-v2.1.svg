<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title>offerU product logo v2.1</title>
  <desc>A refined offerU monogram with a flag-like curl on the U and a subtle accepted-offer check.</desc>
  <defs>
    <linearGradient id="shell" x1="8" x2="56" y1="7" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827"/>
      <stop offset=".58" stop-color="#111827"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="uBody" x1="16" x2="48" y1="14" y2="55" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset=".64" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9dde5"/>
    </linearGradient>
    <linearGradient id="flagFold" x1="39" x2="54" y1="16" y2="34" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset=".74" stop-color="#eef0f4"/>
      <stop offset="1" stop-color="#d9dde5"/>
    </linearGradient>
    <linearGradient id="lift" x1="24" x2="49" y1="43" y2="21" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b08d57"/>
      <stop offset=".5" stop-color="#eef0f4"/>
      <stop offset="1" stop-color="#2f3542"/>
    </linearGradient>
    <filter id="softShadow" x="-25%" y="-25%" width="150%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="5" stdDeviation="3" flood-color="#020617" flood-opacity=".27"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="17" fill="url(#shell)"/>
  <path d="M12.5 50 51.5 11" stroke="#eef0f4" stroke-width="1.05" stroke-linecap="round" opacity=".12"/>

  <path
    d="M20 16.6v21.2C20 47 24.9 53 32 53s12-6 12-15.2V16.6"
