    stroke="url(#uBody)"
    stroke-width="8.6"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#softShadow)"
  />
  <path
    d="M44 16.6c4.8-.1 8.9 3.6 8.9 8.4v8.9c0 4.7-3.5 8.4-7.9 8.4-3.7 0-6.9-2.6-7.7-6.2 2.7.6 5.1-1.4 5.1-4.3V20.4c0-2.1.7-3.4 1.6-3.8Z"
